<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rezepte">
<meta name="theme-color" content="#ffffff">
<title>Rezepte</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/">Rezepte</a>
    <nav>
      <a id="nav-raster" href="#/">Raster</a>
      <a id="nav-buch" href="#/buch">Buch</a>
    </nav>
  </header>

  <!-- Raster (wie Instagram) -->
  <main id="raster" class="raster"></main>

  <!-- Einzelnes Rezept: nur Text -->
  <article id="rezept" class="rezept" hidden>
    <a class="zurueck" href="#/">Zurück</a>
    <div id="rezept-inhalt"></div>
  </article>

  <!-- Buch: blättern -->
  <section id="buch" class="buch" hidden>
    <div id="buch-seite" class="buch-seite"></div>
    <footer class="buch-nav">
      <a id="buch-zurueck" href="#">←</a>
      <span id="buch-zahl"></span>
      <a id="buch-weiter" href="#">→</a>
    </footer>
  </section>

  <p id="leer" class="leer" hidden>Noch keine Rezepte.</p>

  <script src="app.js"></script>
</body>
</html>
